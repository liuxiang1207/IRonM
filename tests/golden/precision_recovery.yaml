# 黄金用例：恢复精度（R-PR-RECOVERY）。设备接入前最高 P1。
# checkin_weeks：4 周中有几周的签到填了疲劳或睡眠；energy_days：4 周中选择了每日精力的天数。
target: ironm.engine.precision:recovery_precision_from_counts
status: active
inject: [rulebook]
rules: [R-PR-RECOVERY]
cases:
  - id: G-PR-R-001
    title: 签到 3 周 → P1
    given: {checkin_weeks: 3, energy_days: 0}
    expect: {precision: P1}
  - id: G-PR-R-002
    title: 签到只有 2 周 → P0
    twin_of: G-PR-R-001
    given: {checkin_weeks: 2, energy_days: 0}
    expect: {precision: P0}
  - id: G-PR-R-003
    title: 每日精力 16 天 → P1
    given: {checkin_weeks: 0, energy_days: 16}
    expect: {precision: P1}
  - id: G-PR-R-004
    title: 每日精力 15 天 → P0
    twin_of: G-PR-R-003
    given: {checkin_weeks: 0, energy_days: 15}
    expect: {precision: P0}
  - id: G-PR-R-005
    title: 签到 4 周且精力 28 天，设备接入前也不超过 P1
    given: {checkin_weeks: 4, energy_days: 28}
    expect: {precision: P1}
