# 黄金用例：体重趋势线性回归（spec §13）。数值比较允许 1e-6 的误差。
#
# G-TR-001 手算过程（x 为天数，y 为千克）：
#   x = 0 1 2 3 4，y = 80 79 79 78 77；x̄ = 2，ȳ = 78.6
#   Sxx = 4+1+0+1+4 = 10；Sxy = (-2)(1.4)+(-1)(0.4)+0+(1)(-0.6)+(2)(-1.6) = -7.0
#   斜率 = -0.7 千克/天 = -4.9 千克/周；截距 = 78.6 + 0.7×2 = 80.0
#   拟合值 80, 79.3, 78.6, 77.9, 77.2；残差 0, -0.3, 0.4, 0.1, -0.2；SSE = 0.30
#   残差方差 = 0.30 / (5-2) = 0.1，残差标准差 = √0.1 = 0.316228
#   斜率标准误 = √(0.1 / 10) = 0.1 千克/天 = 0.7 千克/周
#   t(0.975, 3) = 3.182446（查表）；可信范围 = -4.9 ± 3.182446×0.7 = [-7.127712, -2.672288]
#
# G-TR-002 的期望值由分数精确计算得到（与被测代码无关），t 值同样取自统计表。
# 截距指第一次读数时刻的拟合体重；数据不足时数值字段为“未知（数据不足）”。
target: ironm.engine.trend:fit_trend
status: active
rules: []
cases:
  - id: G-TR-001
    title: 手算样例（5 次读数）
    given: {points: [[0, 80], [1, 79], [2, 79], [3, 78], [4, 77]], ci_level: 0.95, min_readings: 3}
    expect:
      sufficient: true
      n: 5
      span_days: 4
      slope_kg_per_week: -4.9
      intercept_kg: 80.0
      se_kg_per_week: 0.7
      ci_low: -7.127712
      ci_high: -2.672288
      residual_sd_kg: 0.316228
  - id: G-TR-002
    title: 两周、5 次读数的实际样例
    given: {points: [[0, 82.4], [3, 82.1], [7, 81.6], [10, 81.7], [14, 81.0]], ci_level: 0.95, min_readings: 3}
    expect:
      sufficient: true
      n: 5
      span_days: 14
      slope_kg_per_week: -0.646417
      intercept_kg: 82.387948
      se_kg_per_week: 0.106206
      ci_low: -0.984411
      ci_high: -0.308423
      residual_sd_kg: 0.168131
  - id: G-TR-003
    title: 只有 2 次读数，数据不足，还差 1 次
    given: {points: [[0, 80], [3, 79.6]], ci_level: 0.95, min_readings: 3}
    expect: {sufficient: false, needed_readings: 1, slope_kg_per_week: {unknown: insufficient_data}}
  - id: G-TR-004
    title: 3 次读数但都在同一时刻，无法估计趋势
    given: {points: [[0, 80], [0, 79.8], [0, 80.2]], ci_level: 0.95, min_readings: 3}
    expect: {sufficient: false, needed_readings: 1, slope_kg_per_week: {unknown: insufficient_data}}
