# 安全回答模板（spec §24、§26）：红旗四段式、四项拒答、分层提示。只能由人修改；回答中不出现用户原话。
# 2026-10-21 由 Claude 受项目负责人委托对照公开资料审定，未经执业医师复核；逐项记录见 spec/review_log.md。
# 热线号码每年复核一次（12356 各省服务时长不同，不写“24 小时”）。
# 占位符只能用：四段式“专业帮助”中的 {departments}（科室）与 {bring}（可以告诉医生的信息）；
# 分层未知提示中的 {missing}（还差的信息）。
version: "1.0"
review: approved

titles:
  conclusion: 安全结论
  stop: 现在需要停止的
  cannot_judge: 我不能判断的
  help: 建议的专业帮助
  refusal: 这个问题我不能回答
  notice: 提示

# 四段式：按级别的基本文字
levels:
  emergency:
    conclusion: 你描述的情况可能很危险，需要马上就医。
    stop: 立即停止运动，坐下或躺下休息，不要独自离开或自己开车去医院。
    cannot_judge: 我不能判断是什么原因，也不能代替医生诊断或处理；不要因为症状减轻就继续训练。
    help: 现在就拨打 120，或请身边的人帮你拨打；如果是身边的人出现这种情况，同样立即拨打 120。如果有人倒地后叫不醒、没有正常呼吸，立即开始胸外按压，并请人取来附近的 AED，120 调度员会在电话里指导你。就诊时可以告诉医生：{bring}。
  red_flag:
    conclusion: 你描述的情况需要尽快就医检查，在医生确认之前先不要继续相关训练。
    stop: 暂停会引起或加重这些不适的训练。
    cannot_judge: 我不能判断是什么原因，也不能代替医生诊断；症状加重或出现新的不适时，立即就医。
    help: 尽快到{departments}就诊；症状加重或休息后不缓解时，立即拨打 120。就诊时可以告诉医生：{bring}。医生确认可以运动后，在 App 里点“已就医”，再恢复训练建议。

# 四段式：按急症词表的类别补充（多个类别合并去重）。
# conclusion 可替换级别的结论句；help_extra 放在专业帮助的开头。bring 的每一项不能含顿号。
categories:
  mental_health:
    conclusion: 谢谢你愿意说出来。你现在的安全最重要：如果已经伤害了自己或马上有危险，请立即拨打 120 或 110。
    stop: 先不要一个人待着，请联系身边信任的人陪着你；把药物、刀具等可能伤害自己的东西放远。
    department: 精神心理科或当地精神卫生中心
    bring: [最近的情绪和睡眠变化, 有没有伤害自己的想法或行为, 正在吃的药]
    help_extra: 现在就可以拨打全国心理援助热线 12356（可匿名），或北京心理危机研究与干预中心 24 小时热线 010-82951332，会有人陪你聊。
  allergy:
    stop: 立即停止运动，不要再吃东西；平躺并抬高双腿，呼吸困难时改为坐着；医生给你开过肾上腺素笔的，按医嘱立即使用。
    department: 急诊或变态反应科
    bring: [发作前吃过什么以及隔多久开始运动, 当时在做什么运动, 以前有没有过敏]
  abdominal:
    stop: 停止运动，先不要吃东西。
    department: 急诊或消化内科
    bring: [疼痛部位和开始时间, 有没有呕吐或发烧或黑便, 正在用的药（尤其止痛药和减重针）]
  cardiovascular:
    stop: 不要再跑步、跳绳或做任何让心跳加快的运动。
    department: 心内科
    bring: [不适开始的时间和持续多久, 当时在做什么运动, 最近的血压和心率记录, 正在吃的药]
  syncope:
    stop: 不要做高强度和快速起身的动作；一旦头晕或眼前发黑，立即坐下或躺下。
    department: 心内科
    bring: [晕倒或眼前发黑前后的情况, 当时在做什么运动, 最近的血压和心率记录, 正在吃的药]
  respiratory:
    stop: 停止运动，坐直休息，保持通风。
    department: 呼吸内科（运动时气短加重也可能与心脏有关，必要时看心内科）
    bring: [喘不上气开始的时间, 当时在做什么运动, 以前有没有哮喘等病史]
  neuro:
    stop: 停止训练，尤其是负重和用力憋气的动作；头部受伤后当天不要再训练，不要独处，不要自己开车。
    department: 神经内科
    bring: [症状开始的时间, 哪一侧或哪些部位不舒服, 当时在做什么动作]
  musculoskeletal:
    stop: 停止使用受影响的部位，不要继续负重。
    department: 骨科或运动医学科
    bring: [受伤或不适开始的时间, 当时在做什么动作, 最近几次训练的内容和重量]
  heat:
    stop: 立即停止运动，移到阴凉通风处，脱去多余衣物；用凉水喷洒全身并持续扇风，有条件时用冷水浸泡或冰袋敷颈部、腋下、大腿根降温；清醒能吞咽时少量多次喝水或淡盐水，意识不清时不要喂水。
    department: 急诊
    bring: [运动时的温度和时长, 喝了多少水]
  metabolic:
    stop: 停止运动，坐下休息；如果清醒、能吞咽，立即吃或喝约 15 克快速升糖的食物（如半杯果汁、一勺白糖、3–4 块方糖或葡萄糖片），15 分钟后仍不缓解再吃一次；意识不清或不能吞咽时不要喂食喂水。
    department: 内分泌科
    bring: [最近的血糖记录, 正在用的降糖药和用量, 运动前吃了什么]
  pregnancy:
    stop: 停止运动，坐下或向左侧躺下休息，不要平躺。
    department: 产科
    bring: [孕周, 不适开始的时间, 当时在做什么运动]
  eating_disorder:
    stop: 暂停热量控制和频繁称重。
    department: 精神心理科或进食障碍门诊
    bring: [最近的饮食和呕吐情况, 是否用过泻药, 最近的体重变化, 有没有心慌或抽筋或头晕]

# 四项拒答
refusals:
  diagnosis: 我不能判断你是不是得了某种病，也不能解读检查报告。请带着检查结果去医院相应科室就诊；症状突然加重时立即就医。
  prescription: 用什么药、用多少、能不能一起用，都必须由医生决定，我不能给出药物或剂量建议。请咨询给你开药的医生或药师。
  treatment: 我不能制定治疗方案。请到医院就诊，由医生制定；在医生允许之前，先不要做会加重不适的训练。
  emergency_service: 我不能替你呼叫急救。情况紧急时请立即自己拨打 120，或请身边的人帮忙。

# 分层提示
notices:
  paused_until_clearance: 你之前提到的不适还没有确认就医。在医生确认可以运动之前，我先不给训练建议；就医后在 App 里点“已就医”即可恢复。
  tier_b: 根据你的情况，训练强度、调整幅度都按保守规则安排；开始前建议先请医生评估。
  tier_collaborative: 减重药物的用法、剂量和不适反应请问开药的医生；我只提供训练、饮食与记录方面的支持。
  tier_c: 根据你的情况，我只提供记录、趋势和给医生看的沟通摘要，不给训练或饮食计划。
  fat_loss_not_applicable: 你的体重已经偏低，我不提供减脂计划；可以帮你做力量训练和均衡饮食方面的记录。
  tier_d: 未满 18 岁的用户暂不开放训练和饮食计划。
  tier_unknown: 我需要先了解一些信息才能给计划：{missing}。

# 分层未知时，“还差的信息”的叫法
missing_labels:
  birth_date: 出生日期
  sex: 性别
  height_cm: 身高
  weight_kg: 体重
  waist_cm: 腰围
  conditions: 健康状况问卷
