# 急症词表（spec §21、§22、§26）。只能由人修改；改动后必须跑红旗测试集并重新生成 App 离线数据（make offline）。
# 2026-10-21 由 Claude 受项目负责人委托对照公开资料审定，未经执业医师复核；逐项记录见 spec/review_log.md。
# 两层：
#   symptoms 症状：terms 任一说法出现即命中；combos 每项是几组词，同一分句里每组都出现才命中；
#            blood_pressure 按数值判断（同一分句里要有 context 中的字样）。
#   rules 判定条目：all 中的症状在同一句话里都出现时给出 level。多条命中取最高一级。
# 说法要写成统一后的形式：半角、小写、不含空白与分句符号。
# 依据：ACSM 运动前健康筛查（第 10 版）的症状清单；AHA 心脏病发作与卒中（BE FAST）警示信号；
#       中暑、低血糖、横纹肌溶解、马尾综合征、深静脉血栓、孕期危险信号（ACOG 804）的通行就医标准；
#       严重过敏、哮喘（GINA）、脑震荡（CRT6）、自伤与轻生的危机处理。
# 每个症状可写 not_followed_by：说法后紧跟这些字时这一处不算（如“吃完就吐”后接“槽”）。
version: "1.1"
review: approved

# 否定与“以前发生过”：只取消紧挨着的一处说法；拿不准时按出现处理。血压数值不受影响。
negation:
  # 说法前紧挨着这些词时，这一处不算（“没有胸痛”“不头晕”“未见红”）
  before: [没有, 没, 不, 无, 未, 不再, 不太, 不怎么, 没怎么, 没感觉, 不觉得, 没觉得]
  # 但前面以这些词结尾时仍算：“差点没晕倒”是差一点晕倒
  exceptions: [差点没, 差一点没, 险些没, 差点儿没]
  # 说法后紧跟“过”表示以前发生过（“上周胸口疼过”“以前晕倒过”），这一处不算……
  past_after: 过
  # ……“晕倒过去”“过敏”“过多”“过后”“过来”等不是以前发生过（冲刺 2 末审查 H2）
  past_not_followed_by: [去, 敏, 多, 后, 度, 来, 量, 速, 快, 头, 劳, 分, 于, 程]
  # 句中有再次发生或近期的字样时，以前发生过的也照常算（“以前胸口疼过，今天又疼了”“今天晕倒过一次”）
  recurrence: [又, 再次, 还是, 刚才, 刚刚, 这次, 还在, 再一次, 又开始, 今天, 昨天, 这几天, 最近, 这周]

symptoms:
  - id: chest_pain
    name: 胸痛或胸闷
    terms: [胸痛, 胸闷, 心绞痛, 心口疼, 心口痛, 胸部疼, 胸部痛, 胸部闷]
    combos:
      # 不含“胸部”：健身语境里多指胸肌（“练完胸部好紧”）
      - [[胸口, 胸前, 前胸, 心口, 胸骨], [痛, 疼, 闷, 压, 紧, 憋, 堵, 难受, 绞, 揪]]
  - id: radiating
    name: 疼痛或麻木放射到左臂、下巴、后背
    terms: [左胳膊, 左臂, 左手臂, 左边胳膊, 左边手臂, 左手也, 左肩, 下巴, 下颌, 后背, 牙也疼]
  - id: cold_sweat
    name: 出冷汗
    terms: [冷汗, 虚汗, 大汗淋漓]
  - id: ongoing
    name: 正在持续、休息不缓解或加重
    # 不单用“还在”：“我还在坚持跑步”“现在还在喘”不是症状持续
    terms: [还在疼, 还在痛, 还在闷, 还在憋, 还疼, 还痛, 还是疼, 还是痛, 一直疼, 一直痛, 一直闷, 持续, 到现在, 不缓解, 没有缓解, 不见缓解, 休息了也, 也不行, 没缓解, 不见好, 没好转, 越来越厉害, 越来越重, 越来越疼, 停不下来, 止不住, 休息也, 歇了也, 坐下也, 躺下也]
  - id: sudden
    name: 突然发生
    terms: [突然, 一下子, 猛地, 突发]
  - id: collapse
    name: 晕倒或意识丧失
    terms: [晕倒, 昏倒, 晕过去, 昏过去, 倒下, 倒地, 晕厥, 昏厥, 失去意识, 没了意识, 不省人事, 叫不醒, 叫不应]
    combos:
      # “没反应”须说的是人（“手机没有反应了”不算）
      - [[人, 他, 她, 叫, 喊], [没反应, 没有反应, 不应, 不答应, 没回应]]
      - [[人, 他, 她, 突然], [倒了, 栽倒]]
  - id: seizure
    name: 抽搐
    terms: [抽搐, 抽风, 口吐白沫]
  - id: presyncope
    name: 眼前发黑
    terms: [眼前一黑, 眼前发黑, 黑朦]
  - id: cyanosis
    name: 嘴唇或脸色发紫
    terms: [发绀]
    combos:
      - [[嘴唇, 嘴巴, 脸色, 脸], [发紫, 紫了, 发青, 青紫, 紫色]]
  - id: dyspnea
    name: 呼吸困难
    terms: [喘不上气, 喘不过气, 上不来气, 呼吸困难, 透不过气, 吸不上气, 喘得厉害, 气短, 憋得慌]
  - id: dyspnea_severe
    name: 严重的呼吸困难
    terms: [憋死, 窒息, 呼吸不上来, 喘不过来要死, 喘不上气要死]
  - id: change_worse
    name: 比以前明显变差
    terms: [以前不会, 以前不这样, 以前没有, 比以前, 越来越, 最近总, 最近老, 最近经常]
  - id: fast_heart
    name: 心跳很快
    terms: [心跳特别快, 心跳很快, 心跳太快, 心跳飞快, 心跳得很快, 心跳过速, 心动过速]
  - id: palpitation
    name: 心慌、心律不齐
    terms: [心慌, 心悸, 心跳乱, 心跳不齐, 心律不齐, 一下快一下慢, 漏跳, 早搏, 心脏乱跳]
  - id: dizziness
    name: 头晕
    terms: [头晕, 眩晕, 头昏, 发晕, 晕乎乎, 天旋地转, 站不稳, 头重脚轻, 眼花]
    combos:
      - [[头], [很晕, 好晕, 有点晕, 特别晕, 晕得]]
  - id: headache
    name: 头痛
    terms: [头痛, 头疼, 脑袋疼, 脑袋痛, 头要炸, 头像要炸]
  - id: severe
    name: 程度剧烈
    terms: [剧烈, 炸开, 要炸, 从来没有这么, 从来没这么, 从没这么, 受不了, 很厉害, 特别厉害, 非常厉害, 得厉害, 剧痛]
  - id: speech
    name: 说话不清
    terms: [说话不清, 说话说不清, 说话也说不清, 说不出话, 口齿不清, 吐字不清, 说话含糊, 讲话含糊, 舌头发硬, 舌头不听使唤]
    combos:
      - [[说话, 讲话, 吐字], [不太清, 不清楚, 含糊]]
  - id: one_side_weak
    name: 一侧脸或肢体麻木无力
    terms: [嘴歪, 口角歪, 口眼歪斜, 半身不遂, 偏瘫]
    combos:
      - [[嘴, 嘴角, 脸], [歪]]
      - [[一边, 半边, 一侧, 单侧, 左边, 右边, 左半边, 右半边, 左手, 右手], [脸, 手, 胳膊, 腿, 身子, 身体], [麻, 没力, 无力, 没劲, 不听使唤, 动不了, 抬不起, 拿不住]]
  - id: vision_loss
    name: 视力突然丧失或重影
    terms: [看不见, 看不清, 视物模糊, 重影, 一只眼睛黑, 眼前一片黑]
  - id: dark_urine
    name: 尿色像酱油或浓茶
    terms: [酱油色, 茶色尿, 可乐色]
    combos:
      # 须说颜色（“喝了可乐老想尿尿”不算）
      - [[尿, 小便], [酱油, 茶色, 可乐色, 像可乐, 深褐, 发黑, 黑色, 咖啡色, 浓茶色, 像浓茶]]
  - id: confusion
    name: 意识不清
    terms: [意识模糊, 神志不清, 意识不清, 胡言乱语, 认不出人, 答非所问]
    combos:
      - [[脑子, 意识, 神志, 头脑], [不清, 迷糊, 模糊, 糊涂, 发懵]]
      # “迷迷糊糊”须说的是人（“早上迷迷糊糊起来去跑步”不算）
      - [[人, 脑子, 整个人], [迷迷糊糊, 糊里糊涂]]
  - id: heat_exposure
    name: 高温或暴晒环境
    terms: [大太阳, 太阳下, 烈日, 高温, 暴晒, 中暑, 天很热, 天太热, 天气热, 闷热, 桑拿天, 三伏天]
  - id: no_sweat_hot
    name: 不再出汗或体温很高
    terms: [不出汗, 不怎么出汗, 不太出汗, 没有汗, 没汗了, 停止出汗, 皮肤很烫, 体温很高, 身上发烫]
  - id: heat_illness
    name: 中暑的一般表现
    terms: [恶心, 想吐, 呕吐, 头痛, 头疼, 抽筋, 乏力, 浑身无力]
  - id: diabetes
    name: 糖尿病或用降糖药
    # 不单用“胰岛素”：“胰岛素抵抗”不是用胰岛素；磺脲类（格列××）同样会引起低血糖
    terms: [糖尿病, 降糖药, 打胰岛素, 用胰岛素, 注射胰岛素, 胰岛素针, 胰岛素泵, 低血糖, 血糖低, 血糖很低, 二甲双胍, 格列, 磺脲]
  - id: hypo_signs
    name: 低血糖表现
    terms: [发抖, 手抖, 冷汗, 虚汗, 心慌, 头晕, 眼前发黑, 饿得发慌, 浑身无力]
  - id: back_pain
    name: 腰背痛
    terms: [腰疼, 腰痛, 腰椎]
    combos:
      - [[腰, 下背], [疼, 痛]]
  - id: bladder_loss
    name: 大小便失控或排不出
    terms: [尿失禁, 大小便失禁, 便失禁, 尿不出来, 尿不出, 排尿困难, 解不出小便]
    combos:
      - [[控制不住, 憋不住, 失禁, 管不住], [尿, 便]]
  - id: saddle_numb
    name: 会阴、臀部、大腿内侧发麻
    terms: [会阴麻, 鞍区麻]
    combos:
      - [[屁股, 臀部, 会阴, 肛门, 大腿内侧, 裆], [麻, 没知觉, 没感觉]]
  - id: leg_numb
    name: 腿脚发麻或放射痛
    terms: [坐骨神经]
    combos:
      - [[腿, 脚], [麻, 窜, 放射, 过电]]
  - id: pregnancy
    name: 怀孕
    terms: [怀孕, 孕期, 孕妇, 怀着孕, 孕周, 孕早期, 孕中期, 孕晚期, 怀了宝宝, 怀二胎]
    combos:
      - [[孕], [周]]
  - id: pregnancy_warning
    name: 孕期危险信号
    terms: [见红, 出血, 流血, 破水, 羊水, 阴道流液, 肚子疼, 肚子痛, 腹痛, 宫缩, 肚子发紧, 胎动少, 胎动减少, 胎动变少, 头痛, 视物模糊, 看东西模糊]
  - id: pregnancy_caution
    name: 孕期其他危险信号（ACOG）
    terms: [头晕, 眩晕, 胸痛, 胸闷, 喘不上气, 小腿肿, 小腿疼, 腿肚子疼, 站不稳, 没力气]
  - id: bp_crisis
    name: 血压极高
    blood_pressure:
      context: [血压, 高压, 低压, mmhg]
      systolic_at_least: 180
      diastolic_at_least: 110  # 3 级高血压 ≥ 180/110
  - id: calf_swelling
    name: 小腿肿
    combos:
      - [[小腿, 腿肚, 腓肠肌], [肿]]
  - id: unilateral
    name: 只有一侧
    # 不含“一边”：常见于“一边跑一边……”
    terms: [一侧, 单侧, 左小腿, 右小腿, 左腿, 右腿, 一条腿]
  - id: red_hot
    name: 局部发红发烫
    terms: [发烫, 发红, 红肿, 烫手, 摸着烫, 发热, 又红又肿]
  - id: joint_swelling
    name: 关节肿
    combos:
      - [[膝, 踝, 肘, 关节, 手腕, 肩], [肿]]
  - id: fever
    name: 发烧
    terms: [发烧, 高烧, 低烧, 体温高, 体温升高, 烧到]
  - id: cant_bear
    name: 不能走路或负重
    terms: [没法走路, 走不了路, 不能走路, 走不了, 站不起来, 不能着地, 不敢着地, 没法着地, 不能负重, 一瘸一拐, 瘸了]
  - id: injury
    name: 扭伤、拉伤、摔伤
    terms: [扭了, 扭伤, 崴了, 崴脚, 拉伤, 撕裂, 摔了, 摔倒, 撞了, 咔的一声, 啪的一声, 听到响声]
  - id: fracture_signs
    name: 疑似骨折或脱位
    # 不含“变形”：健身语境里多指动作变形
    terms: [骨折, 骨头变形, 畸形, 脱臼, 错位]
  - id: night_pain
    name: 夜间疼醒
    terms: [疼醒, 痛醒, 疼得睡不着, 痛得睡不着, 半夜疼, 夜间痛, 夜里疼, 夜里痛]
  - id: purge
    name: 催吐或用泻药
    # 不单用“去吐”“吐出来”“吐掉”：“去吐槽”“发力时把气吐出来”不是催吐
    terms: [催吐, 抠喉, 抠嗓子, 故意吐, 吃完就吐, 吃了就吐, 吃完就去吐, 吃了就去吐, 吃完去吐, 吃完饭就吐, 吃泻药, 用泻药, 吃了泻药, 用了泻药, 喝泻药, 番泻叶]
    combos:
      - [[吃, 饭, 东西, 食物], [吐出来, 吐掉]]
    not_followed_by: [槽]
  - id: self_harm_act
    name: 正在或已经自伤
    terms: [割腕, 吃了很多安眠药, 吞药, 吃了一整瓶, 遗书, 准备自杀, 正在自杀, 跳楼]
  - id: self_harm_idea
    name: 轻生想法
    terms: [想死, 想去死, 不如死了, 不想活, 活着没意思, 活不下去, 自杀, 轻生, 结束生命, 想消失, 伤害自己, 自残]
