  - id: pregnancy_warning
    name: 孕期危险信号
    terms: [见红, 出血, 流血, 破水, 羊水, 阴道流液, 肚子疼, 肚子痛, 腹痛, 宫缩, 肚子发紧, 胎动少, 胎动减少, 胎动变少, 头痛, 视物模糊, 看东西模糊]
  - id: pregnancy_caution
    name: 孕期其他危险信号（ACOG）
    terms: [头晕, 眩晕, 胸痛, 胸闷, 喘不上气, 小腿肿, 小腿疼, 腿肚子疼, 站不稳, 没力气]
  - id: bp_crisis
    name: 血压极高
    blood_pressure:
      context: [血压, 高压, 低压, mmhg]
      systolic_at_least: 180
      diastolic_at_least: 110  # 3 级高血压 ≥ 180/110
  - id: calf_swelling
    name: 小腿肿
    combos:
      - [[小腿, 腿肚, 腓肠肌], [肿]]
  - id: unilateral
    name: 只有一侧
    # 不含“一边”：常见于“一边跑一边……”
    terms: [一侧, 单侧, 左小腿, 右小腿, 左腿, 右腿, 一条腿]
  - id: red_hot
    name: 局部发红发烫
    terms: [发烫, 发红, 红肿, 烫手, 摸着烫, 发热, 又红又肿]
  - id: joint_swelling
    name: 关节肿
    combos:
      - [[膝, 踝, 肘, 关节, 手腕, 肩], [肿]]
  - id: fever
    name: 发烧
    terms: [发烧, 高烧, 低烧, 体温高, 体温升高, 烧到]
  - id: cant_bear
    name: 不能走路或负重
    terms: [没法走路, 走不了路, 不能走路, 走不了, 站不起来, 不能着地, 不敢着地, 没法着地, 不能负重, 一瘸一拐, 瘸了]
  - id: injury
    name: 扭伤、拉伤、摔伤
    terms: [扭了, 扭伤, 崴了, 崴脚, 拉伤, 撕裂, 摔了, 摔倒, 撞了, 咔的一声, 啪的一声, 听到响声]
  - id: fracture_signs
    name: 疑似骨折或脱位
    # 不含“变形”：健身语境里多指动作变形
    terms: [骨折, 骨头变形, 畸形, 脱臼, 错位]
  - id: night_pain
    name: 夜间疼醒
    terms: [疼醒, 痛醒, 疼得睡不着, 痛得睡不着, 半夜疼, 夜间痛, 夜里疼, 夜里痛]
  - id: purge
    name: 催吐或用泻药
    # 不单用“去吐”“吐出来”“吐掉”：“去吐槽”“发力时把气吐出来”不是催吐
    terms: [催吐, 抠喉, 抠嗓子, 故意吐, 吃完就吐, 吃了就吐, 吃完就去吐, 吃了就去吐, 吃完去吐, 吃完饭就吐, 吃泻药, 用泻药, 吃了泻药, 用了泻药, 喝泻药, 番泻叶]
    combos:
      - [[吃, 饭, 东西, 食物], [吐出来, 吐掉]]
    not_followed_by: [槽]
  - id: self_harm_act
    name: 正在或已经自伤
    terms: [割腕, 吃了很多安眠药, 吞药, 吃了一整瓶, 遗书, 准备自杀, 正在自杀, 跳楼]
  - id: self_harm_idea
    name: 轻生想法
    terms: [想死, 想去死, 不如死了, 不想活, 活着没意思, 活不下去, 自杀, 轻生, 结束生命, 想消失, 伤害自己, 自残]
  - id: hives
    name: 全身风团或嘴唇肿
    # 脸肿、眼皮肿单独不算（“吃咸了脸肿”“哭了眼皮肿”，冲刺 2 复核 N2）；舌头肿见喉咙发紧
    # 不用“身上痒”：跑步时身上痒很常见（第三轮复核）
    terms: [风团, 荨麻疹, 全身起疹子, 全身起疙瘩, 全身起红, 全身痒, 嘴唇肿, 嘴肿]
    combos:
      - [[嘴唇], [肿]]
  - id: face_swelling
    name: 脸或眼睛肿
    combos:
      - [[脸, 眼睛, 眼皮], [肿]]
  - id: itch
    name: 痒或起疹子
    terms: [痒, 起疹子, 起风团]
  - id: allergen
    name: 常见过敏原或过敏
    # 不用“蜂”单字：“喝了蜂蜜水”（第三轮复核）
    terms: [花生, 坚果, 虾, 蟹, 海鲜, 芒果, 蜜蜂, 马蜂, 黄蜂, 蛰, 蜇, 过敏, 吃了药, 打了针]
  - id: face_allergy
    name: 接触过敏原后脸或眼睛肿（同一分句）
    combos:
      - [[花生, 坚果, 虾, 蟹, 海鲜, 芒果, 蜜蜂, 马蜂, 黄蜂, 蛰, 蜇, 过敏, 吃了药, 打了针], [脸, 眼睛, 眼皮], [肿]]
  - id: throat_swelling
    name: 喉咙发紧或肿
    terms: [喉咙发紧, 嗓子发紧, 喉咙肿, 嗓子肿, 舌头肿, 咽不下去]
  - id: asthma
    name: 哮喘
    terms: [哮喘, 喘鸣, 嗓子里有哨音]
  - id: reliever_fail
    name: 用了急救药不缓解
    terms: [喷了药也, 喷了也, 喷了没用, 吸了药也, 药不管用]
  - id: head_injury
    name: 头部受伤
    terms: [脑震荡, 撞到头, 砸到头, 磕到头, 摔到头, 头撞, 头被砸]
  - id: head_red
    name: 头部受伤后的危险信号（CRT6）
    terms: [吐了, 呕吐, 越来越疼, 犯困, 嗜睡, 想睡, 记不清, 断片, 重影, 脖子疼]
  - id: hematemesis
    name: 吐血
    terms: [吐血, 呕血]
  - id: gi_bleed
    name: 便血或黑便
    terms: [便血, 黑便, 柏油样]
  - id: abdominal_severe
    name: 腹部剧痛
    combos:
      - [[肚子, 腹部, 胃, 上腹], [剧痛, 疼得厉害, 疼得直不起腰, 疼到后背]]
  - id: purge_complication
    name: 催吐后的电解质紊乱表现
    terms: [心慌, 头晕, 抽筋, 手脚麻, 没力气, 浑身无力, 心跳乱, 晕]

rules:
  # ---- 心理危机（放在最前：同时命中其他类别时，回答以关心与热线开头）----
  - {id: EM-SELF-HARM-ACT, level: emergency, category: mental_health, title: 正在或已经自伤, all: [self_harm_act]}
  - {id: RF-SELF-HARM, level: red_flag, category: mental_health, title: 轻生想法, all: [self_harm_idea]}
  # ---- 严重过敏 ----
  - {id: EM-ANAPHYLAXIS-AIRWAY, level: emergency, category: allergy, title: 喉咙发紧或肿（严重过敏）, all: [throat_swelling]}
  - {id: EM-ANAPHYLAXIS-BREATH, level: emergency, category: allergy, title: 全身风团伴呼吸困难, all: [hives, dyspnea]}
  - {id: EM-ANAPHYLAXIS-FAINT, level: emergency, category: allergy, title: 全身风团伴头晕, all: [hives, dizziness]}
  - {id: EM-ANAPHYLAXIS-FACE, level: emergency, category: allergy, title: 接触过敏原后脸或眼睛肿伴呼吸困难, all: [face_swelling, allergen, dyspnea]}
  - {id: RF-ALLERGY-FACE, level: red_flag, category: allergy, title: 接触过敏原后脸或眼睛肿, all: [face_allergy]}
  - {id: RF-ALLERGY-ITCH, level: red_flag, category: allergy, title: 脸或眼睛肿伴痒、起疹子, all: [face_swelling, itch]}
  - {id: RF-HIVES, level: red_flag, category: allergy, title: 全身风团或嘴唇肿, all: [hives]}
  # ---- 心血管 ----
  - {id: EM-CHEST-ONGOING, level: emergency, category: cardiovascular, title: 胸痛正在持续或休息不缓解, all: [chest_pain, ongoing]}
  - {id: EM-CHEST-SUDDEN, level: emergency, category: cardiovascular, title: 突发胸痛, all: [chest_pain, sudden]}
  - {id: EM-CHEST-RADIATE, level: emergency, category: cardiovascular, title: 胸痛放射到左臂、下巴或后背, all: [chest_pain, radiating]}
  - {id: EM-CHEST-SWEAT, level: emergency, category: cardiovascular, title: 胸痛伴出冷汗, all: [chest_pain, cold_sweat]}
  - {id: EM-CHEST-DYSPNEA, level: emergency, category: cardiovascular, title: 胸痛伴呼吸困难, all: [chest_pain, dyspnea]}
  - {id: RF-CHEST, level: red_flag, category: cardiovascular, title: 胸痛或胸闷, all: [chest_pain]}
  - {id: EM-TACHY-ONGOING, level: emergency, category: cardiovascular, title: 心跳很快停不下来, all: [fast_heart, ongoing]}
  - {id: EM-TACHY-DIZZY, level: emergency, category: cardiovascular, title: 心跳很快伴头晕, all: [fast_heart, dizziness]}
  - {id: RF-PALPITATION, level: red_flag, category: cardiovascular, title: 心慌或心律不齐, all: [palpitation]}
  - {id: EM-BP-HEADACHE, level: emergency, category: cardiovascular, title: 血压极高伴头痛, all: [bp_crisis, headache]}
  - {id: EM-BP-CHEST, level: emergency, category: cardiovascular, title: 血压极高伴胸痛, all: [bp_crisis, chest_pain]}
  - {id: EM-BP-DIZZY, level: emergency, category: cardiovascular, title: 血压极高伴头晕, all: [bp_crisis, dizziness]}
  - {id: EM-BP-DYSPNEA, level: emergency, category: cardiovascular, title: 血压极高伴呼吸困难, all: [bp_crisis, dyspnea]}
  - {id: EM-BP-VISION, level: emergency, category: cardiovascular, title: 血压极高伴视物异常, all: [bp_crisis, vision_loss]}
  - {id: RF-BP, level: red_flag, category: cardiovascular, title: 血压极高, all: [bp_crisis]}
  - {id: EM-DVT-UNILATERAL, level: emergency, category: cardiovascular, title: 一侧小腿肿（疑似深静脉血栓）, all: [calf_swelling, unilateral]}
  - {id: EM-DVT-HOT, level: emergency, category: cardiovascular, title: 小腿红肿发烫（疑似深静脉血栓）, all: [calf_swelling, red_hot]}
  # ---- 晕厥 ----
  - {id: EM-COLLAPSE, level: emergency, category: syncope, title: 晕倒或意识丧失, all: [collapse]}
  - {id: EM-COLLAPSE-FELL, level: emergency, category: syncope, title: 突然倒下, all: [collapse_fell]}
  - {id: EM-UNRESPONSIVE, level: emergency, category: syncope, title: 倒下或晕后叫不醒、没反应, all: [unresponsive, collapse_context]}
  - {id: RF-PRESYNCOPE, level: red_flag, category: syncope, title: 眼前发黑, all: [presyncope]}
  - {id: RF-DIZZY, level: red_flag, category: syncope, title: 头晕, all: [dizziness]}
  # ---- 呼吸 ----
  - {id: EM-CYANOSIS, level: emergency, category: respiratory, title: 嘴唇或脸色发紫, all: [cyanosis]}
  - {id: EM-DYSPNEA-ONGOING, level: emergency, category: respiratory, title: 呼吸困难休息不缓解, all: [dyspnea, ongoing]}
  - {id: EM-DYSPNEA-SEVERE, level: emergency, category: respiratory, title: 严重的呼吸困难（喘不上气，快憋死、窒息感）, all: [dyspnea, dyspnea_severe]}
  - {id: EM-DYSPNEA-SUDDEN, level: emergency, category: respiratory, title: 突然喘不上气, all: [dyspnea_sudden]}
  - {id: RF-DYSPNEA-REST, level: red_flag, category: respiratory, title: 休息或轻微活动时也喘不上气、夜里憋醒, all: [dyspnea_rest]}
  - {id: RF-DYSPNEA-IDLE, level: red_flag, category: respiratory, title: 什么都没做也喘不上气, all: [dyspnea, at_rest]}
  - {id: RF-DYSPNEA-WORSE, level: red_flag, category: respiratory, title: 气短比以前明显加重, all: [dyspnea, change_worse]}
  - {id: EM-ASTHMA-NORELIEF, level: emergency, category: respiratory, title: 哮喘用了急救药仍不缓解, all: [asthma, reliever_fail]}
  - {id: RF-ASTHMA, level: red_flag, category: respiratory, title: 运动中哮喘发作, all: [asthma]}
  # ---- 神经 ----
  - {id: EM-SEIZURE, level: emergency, category: neuro, title: 抽搐, all: [seizure]}
  - {id: EM-THUNDERCLAP, level: emergency, category: neuro, title: 突发剧烈头痛, all: [headache, sudden, severe]}
  - {id: RF-HEADACHE-SEVERE, level: red_flag, category: neuro, title: 剧烈头痛, all: [headache, severe]}
  - {id: EM-STROKE-SPEECH, level: emergency, category: neuro, title: 说话不清（卒中征象）, all: [speech]}
  - {id: EM-STROKE-WEAK, level: emergency, category: neuro, title: 一侧脸或肢体麻木无力（卒中征象）, all: [one_side_weak]}
  - {id: EM-STROKE-VISION, level: emergency, category: neuro, title: 突然看不见或重影（卒中征象）, all: [vision_loss, sudden]}
  - {id: EM-HEAD-INJURY, level: emergency, category: neuro, title: 头部受伤后呕吐、嗜睡等（CRT6 危险信号）, all: [head_injury, head_red]}
  - {id: RF-HEAD-INJURY, level: red_flag, category: neuro, title: 头部受伤, all: [head_injury]}
  - {id: EM-CONFUSION, level: emergency, category: neuro, title: 意识不清, all: [confusion]}
  - {id: EM-CAUDA-BLADDER, level: emergency, category: neuro, title: 腰痛伴大小便失控（马尾综合征征象）, all: [back_pain, bladder_loss]}
  - {id: EM-CAUDA-SADDLE, level: emergency, category: neuro, title: 腰痛伴会阴发麻（马尾综合征征象）, all: [back_pain, saddle_numb]}

  # ---- 骨骼肌肉 ----
  - {id: EM-DARK-URINE, level: emergency, category: musculoskeletal, title: 尿色像酱油（疑似横纹肌溶解）, all: [dark_urine]}
  - {id: EM-JOINT-FEVER, level: emergency, category: musculoskeletal, title: 关节肿伴发烧（疑似关节感染）, all: [joint_swelling, fever]}
  - {id: RF-JOINT-HOT, level: red_flag, category: musculoskeletal, title: 关节红肿发烫, all: [joint_swelling, red_hot]}
  - {id: RF-JOINT-CANT-BEAR, level: red_flag, category: musculoskeletal, title: 关节肿且不能负重, all: [joint_swelling, cant_bear]}
  - {id: RF-INJURY-CANT-BEAR, level: red_flag, category: musculoskeletal, title: 受伤后不能负重, all: [injury, cant_bear]}
  - {id: RF-FRACTURE, level: red_flag, category: musculoskeletal, title: 疑似骨折或脱位, all: [fracture_signs]}
  - {id: RF-NIGHT-PAIN, level: red_flag, category: musculoskeletal, title: 夜间疼醒, all: [night_pain]}
  - {id: RF-SCIATICA, level: red_flag, category: musculoskeletal, title: 腰痛伴腿脚发麻（骨科 / 脊柱外科）, all: [back_pain, leg_numb]}
  # ---- 中暑、代谢 ----
  - {id: EM-HEAT-NOSWEAT, level: emergency, category: heat, title: 高温下不再出汗或体温很高, all: [heat_exposure, no_sweat_hot]}
  - {id: EM-HEAT-CONFUSION, level: emergency, category: heat, title: 高温下意识不清, all: [heat_exposure, confusion]}
  - {id: EM-HEAT-COLLAPSE, level: emergency, category: heat, title: 高温下晕倒, all: [heat_exposure, collapse]}
  - {id: RF-HEAT-ILLNESS, level: red_flag, category: heat, title: 高温下恶心、头痛、抽筋等, all: [heat_exposure, heat_illness]}
  - {id: RF-HEAT-DIZZY, level: red_flag, category: heat, title: 高温下头晕, all: [heat_exposure, dizziness]}
  - {id: EM-HYPOGLYCEMIA, level: emergency, category: metabolic, title: 糖尿病人出现低血糖表现, all: [diabetes, hypo_signs]}
  # ---- 孕期 ----
  - {id: EM-PREGNANCY, level: emergency, category: pregnancy, title: 孕期出血、腹痛、破水等危险信号, all: [pregnancy, pregnancy_warning]}
  - {id: RF-PREGNANCY, level: red_flag, category: pregnancy, title: 孕期头晕、胸闷、小腿肿痛等, all: [pregnancy, pregnancy_caution]}
  # ---- 消化道 ----
  - {id: EM-HEMATEMESIS, level: emergency, category: abdominal, title: 吐血, all: [hematemesis]}
  - {id: RF-GI-BLEED, level: red_flag, category: abdominal, title: 便血或黑便（补铁也会黑便）, all: [gi_bleed]}
  - {id: RF-ABDOMEN, level: red_flag, category: abdominal, title: 腹部剧痛（减重针用户注意胰腺炎）, all: [abdominal_severe]}
  # ---- 进食障碍 ----
  - {id: EM-PURGE-COMPLICATION, level: emergency, category: eating_disorder, title: 催吐后心慌、头晕、抽筋（电解质紊乱）, all: [purge, purge_complication]}
  - {id: RF-PURGE, level: red_flag, category: eating_disorder, title: 催吐或用泻药, all: [purge]}
