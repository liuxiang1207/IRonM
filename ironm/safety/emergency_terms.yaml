# 急症词表（spec §21、§22、§26）。只能由人修改；改动后必须跑红旗测试集并重新生成 App 离线数据（make offline）。
# 2026-10-21 由 Claude 受项目负责人委托对照公开资料审定，未经执业医师复核；逐项记录见 spec/review_log.md。
# 两层：
#   symptoms 症状：terms 任一说法出现即命中；combos 每项是几组词，同一分句里每组都出现才命中；
#            blood_pressure 按数值判断（同一分句里要有 context 中的字样）。
#   rules 判定条目：all 中的症状在同一句话里都出现时给出 level。多条命中取最高一级。
# 说法要写成统一后的形式：半角、小写、不含空白与分句符号。
# 依据：ACSM 运动前健康筛查（第 10 版）的症状清单；AHA 心脏病发作与卒中（BE FAST）警示信号；
#       中暑、低血糖、横纹肌溶解、马尾综合征、深静脉血栓、孕期危险信号（ACOG 804）的通行就医标准；
#       严重过敏、哮喘（GINA）、脑震荡（CRT6）、自伤与轻生的危机处理。
# 每个症状可写 not_followed_by：说法后紧跟这些字时这一处不算（如“吃完就吐”后接“槽”）。
version: "1.4"
review: approved

# 否定与“以前发生过”：只取消紧挨着的一处说法；拿不准时按出现处理。血压数值不受影响。
negation:
  # 说法前紧挨着这些词时，这一处不算（“没有胸痛”“不头晕”“未见红”）
  # “天生”：“我天生嘴角歪一点”不是新发生的
  before: [没有, 没, 不, 无, 未, 不再, 不太, 不怎么, 没怎么, 没感觉, 不觉得, 没觉得, 天生]
  # 但前面以这些词结尾时仍算：“差点没晕倒”是差一点晕倒
  exceptions: [差点没, 差一点没, 险些没, 差点儿没]
  # 说法后紧跟“过”表示以前发生过（“上周胸口疼过”“以前晕倒过”），这一处不算……
  past_after: 过
  # ……“晕倒过去”“过敏”“过多”“过后”“过来”等不是以前发生过（冲刺 2 末审查 H2）
  past_not_followed_by: [去, 敏, 多, 后, 度, 来, 量, 速, 快, 头, 劳, 分, 于, 程]
  # “X 过”以前发生过，以下情况照常算（冲刺 2 复核 N3 与第二、三轮复核）：
  # 1. 同一分句或后面的分句有复发说法（“以前胸口疼过，今天又疼了”“今天跑步时也疼”），
  #    但后面那个分句说的是别的部位时不算（“以前晕倒过，最近腿也疼”）；
  #    不单用“又、再次、又犯”：“去年晕倒过一次，现在又胖回来了”“想再次挑战马拉松”“又犯懒”不是复发
  recurrence: [又疼, 又痛, 又闷, 又晕, 又犯病, 又发作, 又开始疼, 又开始痛, 又开始闷, 又开始晕, 又出现, 又抽, 又喘, 又心慌, 再次发作, 再次出现, 也疼, 也痛, 也闷, 就在刚才]
  body_parts: [腿, 膝, 腰, 背, 肩, 脚, 手, 头, 脖子, 肚子, 胳膊, 臂, 踝, 肘, 屁股, 臀, 牙, 眼, 嗓子, 喉咙, 胃, 肌肉]
  # 2. 同一分句或前一个分句有近期或反复的字样（“今天跑步的时候，晕倒过一次”“跑步时胸口疼过好几次”），
  #    但所在分句有久远的时间、又没有近期字样时不算（“去年晕倒过一次，最近想开始减肥”）；
  #    后面分句的近期字样不算（“晕倒过一次，最近想开始减肥”）。拿不准时按出现处理：
  #    “今天跑步之前胸口疼过”照常算，“我今天想问以前胸口疼过能不能练”也会算（已知取舍）
  recent: [刚才, 刚刚, 这次, 今天, 昨天, 前天, 这几天, 最近, 这周, 这两天, 好几次, 几次了, 每次, 经常, 老是, 总是]
  remote: [以前, 之前, 去年, 前年, 上个月, 上周, 小时候, 曾经, 年轻时, 几年前, 那时候, 早年, 上次, 前几年]

symptoms:
  - id: chest_pain
    name: 胸痛或胸闷
    terms: [胸痛, 胸闷, 心绞痛, 心口疼, 心口痛, 胸部疼, 胸部痛, 胸部闷]
    combos:
      # 不含“胸部”：健身语境里多指胸肌（“练完胸部好紧”）
      - [[胸口, 胸前, 前胸, 心口, 胸骨], [痛, 疼, 闷, 压, 紧, 憋, 堵, 难受, 绞, 揪]]
  - id: radiating
    name: 疼痛或麻木放射到左臂、下巴、后背
    terms: [左胳膊, 左臂, 左手臂, 左边胳膊, 左边手臂, 左手也, 左肩, 下巴, 下颌, 后背, 牙也疼]
  - id: cold_sweat
    name: 出冷汗
    terms: [冷汗, 虚汗, 大汗淋漓]
  - id: ongoing
    name: 正在持续、休息不缓解或加重
    # 不单用“还在”：“我还在坚持跑步”“现在还在喘”不是症状持续
    terms: [还在疼, 还在痛, 还在闷, 还在憋, 还疼, 还痛, 还闷, 还是疼, 还是痛, 一直疼, 一直痛, 一直闷, 持续, 到现在, 不缓解, 没有缓解, 不见缓解, 休息了也, 也不行, 没缓解, 不见好, 没好转, 越来越厉害, 越来越重, 越来越疼, 停不下来, 止不住, 休息也, 歇了也, 坐下也, 躺下也]
  - id: sudden
    name: 突然发生
    terms: [突然, 一下子, 猛地, 突发]
  - id: collapse
    name: 晕倒或意识丧失
    # 不用“倒在地上”“栽倒”：“练完腿直接倒在地上”“滑了一跤栽倒了”多是累了或摔了（冲刺 2 第二轮复核）
    terms: [晕倒, 昏倒, 晕过去, 昏过去, 晕了过去, 昏了过去, 倒下, 倒地, 一头栽倒, 栽倒在, 晕厥, 昏厥, 失去意识, 没了意识, 没意识了, 没有意识了, 不省人事]
    combos:
      - [[地上], [一动不动, 不动了, 没反应, 没有反应]]
      - [[他, 她, 人], [失去知觉]]  # “手指失去知觉”是麻木
  - id: collapse_fell
    name: 突然倒了
    terms: [突然倒了, 一下子倒了]
    combos:
      - [[眼前一黑, 眼前发黑, 头一晕], [倒]]
      - [[跑着跑着, 练着练着, 骑着骑着, 走着走着], [倒, 栽]]
    # 只对“倒了”这类说法排除（“突然倒了胃口”“一下子倒了半瓶油”“突然倒了杯水”），不影响“晕倒半小时”
    not_followed_by: [杯, 一杯, 两杯, 水, 胃口, 半, 油, 汤, 点, 些, 进, 出]
  - id: unresponsive
    name: 叫人没反应
    # 单独出现不算（“我叫了外卖半天没反应”“我妈每天早上都喊不醒我”）；须与倒下、晕倒等同时出现
    terms: [叫不醒, 叫不应, 喊不醒, 喊不应]
    combos:
      - [[叫, 喊, 拍], [没反应, 没有反应, 没回应, 不答应, 不应, 不醒]]
    # “不应该”“没反应过来”不算（冲刺 2 复核 N1）
    not_followed_by: [该, 过来]
  - id: collapse_context
    name: 倒下或晕倒
    # 只用成词的说法（不用“倒、晕、摔、突然”单字：“倒是、倒霉、倒立、喝晕、突然想起”很常见，冲刺 2 第三轮复核）
    terms: [倒了, 倒下, 倒地, 晕倒, 昏倒, 晕过去, 昏过去, 摔倒, 栽倒, 躺在地上, 倒在地上, 抽搐]
  - id: seizure
    name: 抽搐
    terms: [抽搐, 抽风, 口吐白沫]
  - id: presyncope
    name: 眼前发黑
    terms: [眼前一黑, 眼前发黑, 黑朦]
  - id: cyanosis
    name: 嘴唇或脸色发紫
    terms: [发绀]
    combos:
      - [[嘴唇, 嘴巴, 脸色, 脸], [发紫, 紫了, 发青, 青紫, 紫色]]
  - id: dyspnea
    name: 呼吸困难
    terms: [喘不上气, 喘不过气, 喘不过来, 喘不上来, 上不来气, 呼吸困难, 呼吸不上来, 透不过气, 吸不上气, 喘得厉害, 气短, 憋得慌]
  - id: dyspnea_severe
    name: 快憋死、窒息感
    # 单独出现不算（“健身房太闷了快憋死了”“这个动作有窒息感”）；须与呼吸困难一起（冲刺 2 复核 N2）
    # 不用“要死”：“累得要死，喘不上气”是夸张说法
    terms: [憋死, 窒息, 憋得要死]
  - id: dyspnea_sudden
    name: 突然喘不上气
    # 须紧挨着（“突然加大强度，喘不过气”“一下子跑太快喘不上气”不算，冲刺 2 第三轮复核）
    terms: [突然喘不上气, 突然喘不过气, 突然喘不过来, 突然上不来气, 突然呼吸困难, 突然呼吸不上来, 突然透不过气, 突然就喘不上气, 突然就喘不过气, 一下子喘不上气, 一下子喘不过气, 一下子上不来气, 一下子呼吸不上来]
  - id: dyspnea_rest
    name: 休息或轻微活动时气短、夜里憋醒
    # 运动中喘不上气很常见；休息字样须与气短在同一分句（“不动也胖，一动就喘不上气”不算）。
    # 不用“坐着、躺着、休息的时候”单独与“喘”搭配：“跑完坐着喘了半天”“组间休息的时候喘得厉害”是运动后（第三轮复核）
    terms: [憋醒, 喘醒, 坐着都喘, 坐着也喘, 躺着都喘, 躺着也喘, 动不动就喘]
    combos:
      - [[坐着也, 坐着都, 躺着也, 躺着都, 平躺, 躺下就, 一躺下, 不动也, 不动都, 沙发上, 休息的时候也, 休息时也, 走几步, 走两步就, 一走路就], [喘不上气, 喘不过气, 喘不过来, 喘不上来, 上不来气, 呼吸困难, 透不过气, 吸不上气, 气短]]
    not_followed_by: [口气, 口]  # “坐着都喘口气”
  - id: at_rest
    name: 什么都没做
    terms: [什么都没做, 什么都没干, 啥也没干, 啥都没干]
  - id: change_worse
    name: 比以前明显变差
    terms: [以前不会, 以前不这样, 以前没有, 比以前, 越来越, 最近总, 最近老, 最近经常]
  - id: fast_heart
    name: 心跳很快
    terms: [心跳特别快, 心跳很快, 心跳太快, 心跳飞快, 心跳得很快, 心跳过速, 心动过速]
  - id: palpitation
    name: 心慌、心律不齐
    terms: [心慌, 心悸, 心跳乱, 心跳不齐, 心律不齐, 一下快一下慢, 漏跳, 早搏, 心脏乱跳]
  - id: dizziness
    name: 头晕
    terms: [头晕, 眩晕, 头昏, 发晕, 晕乎乎, 天旋地转, 站不稳, 头重脚轻, 眼花]
    combos:
      - [[头], [很晕, 好晕, 有点晕, 特别晕, 晕得]]
  - id: headache
    name: 头痛
    terms: [头痛, 头疼, 脑袋疼, 脑袋痛, 头要炸, 头像要炸]
  - id: severe
    name: 程度剧烈
    terms: [剧烈, 炸开, 要炸, 从来没有这么, 从来没这么, 从没这么, 受不了, 很厉害, 特别厉害, 非常厉害, 得厉害, 剧痛]
  - id: speech
    name: 说话不清
    # 只用紧挨着的说法（“教练说话我听不清楚”不算），“含糊其辞”“不清不楚”不算（冲刺 2 复核 N2）
    terms: [说话不清, 说话不太清, 说话说不清, 说话也说不清, 说话也不清, 说话突然不清, 讲话不清, 讲话不太清, 讲话突然不清, 话都说不清, 说不出话, 口齿不清, 吐字不清, 说话含糊, 讲话含糊, 吐字含糊, 说话有点含糊, 讲话有点含糊, 说话变得含糊, 舌头发硬, 舌头不听使唤, 舌头不灵, 舌头僵]
    not_followed_by: [其辞, 不楚]
  - id: one_side_weak
    name: 一侧脸或肢体麻木无力
    # 不单用“脸歪”（“脸歪了吗这个自拍”“突然发现照片里脸歪了”），不用“左脸、右脸”（“自拍左脸歪了”“右脸下垂要做提拉”）；
    # 侧别组合里不含“歪”（“深蹲时身体往右边歪”是动作问题，第二、三轮复核）
    # 后接“笑、着笑、歪歪、歪的”不算（“嘴歪笑”“嘴角歪着笑”“嘴歪歪的”）；前面带“天生”不算
    terms: [嘴歪, 嘴巴歪, 嘴角歪, 嘴有点歪, 口角歪, 口眼歪斜, 半身不遂, 偏瘫, 突然脸歪, 脸突然歪, 一下子脸歪]
    combos:
      - [[一边, 半边, 一侧, 单侧, 左边, 右边, 左半边, 右半边, 左手, 右手], [脸, 手, 胳膊, 腿, 身子, 身体], [麻, 没力, 无力, 没劲, 不听使唤, 动不了, 抬不起, 拿不住]]
      - [[左边脸, 右边脸, 半边脸, 一边脸, 一侧脸], [歪, 下垂, 耷拉]]
      - [[嘴, 嘴角, 嘴巴], [往一边歪, 往左歪, 往右歪, 歪向一边, 歪到一边]]
    not_followed_by: [笑, 着笑, 歪歪, 歪的]
  - id: vision_loss
    name: 视力突然丧失或重影
    terms: [看不见, 看不清, 视物模糊, 重影, 一只眼睛黑, 眼前一片黑]
  - id: dark_urine
    name: 尿色像酱油或浓茶
    terms: [酱油色, 茶色尿, 可乐色]
    combos:
      # 须说颜色（“喝了可乐老想尿尿”不算）
      - [[尿, 小便], [酱油, 茶色, 可乐色, 像可乐, 深褐, 发黑, 黑色, 咖啡色, 浓茶色, 像浓茶]]
  - id: confusion
    name: 意识不清
    terms: [意识模糊, 神志不清, 意识不清, 胡言乱语, 认不出人, 答非所问]
    combos:
      - [[脑子, 意识, 神志, 头脑], [不清, 迷糊, 模糊, 糊涂, 发懵]]
      # “迷迷糊糊”须说的是人（“早上迷迷糊糊起来去跑步”不算）
      - [[人, 脑子, 整个人], [迷迷糊糊, 糊里糊涂]]
  - id: heat_exposure
    name: 高温或暴晒环境
    terms: [大太阳, 太阳下, 烈日, 高温, 暴晒, 中暑, 天很热, 天太热, 天气热, 闷热, 桑拿天, 三伏天]
  - id: no_sweat_hot
    name: 不再出汗或体温很高
