# 问答的固定说法（spec [2026-10-21] §4、§6）：追问、闲聊、超范围、降级提示。
# 2026-10-21 由 Claude 撰写，属设计；不含数字与医疗建议。
version: "1.0"
review: approved

clarify: 我还没太明白你想问哪方面：训练动作、饮食、恢复，还是想记录点什么？可以再多说一句吗？
chitchat: 你好！想问训练、饮食、恢复，或者想记录今天的情况，都可以直接告诉我。
out_of_scope: 这个问题超出了我能帮忙的范围。我能帮你的是训练、饮食、恢复和运动习惯方面的事。
general: 这个问题我暂时没有审定过的答案，先不给具体建议。你可以换个说法再问，或者咨询线下的教练、营养师或医生。
degraded: 这次没能给出完整的回答，下面是一般建议。
plan_change: 改计划需要进入计划调整：我会把你的要求交给计划调整流程，按你的数据和安全规则重新安排，这里先不直接改。
caution_discomfort: 你提到了身体不适：如果疼痛明显、越来越重，或伴随肿胀、麻木，先停止相关训练并咨询医生。
caution_special: 你的情况属于需要特别注意的人群，下面是一般信息；具体训练和饮食安排，请先和医生确认。
profile_immediate: 我记下了你提到的健康状况，之后的建议会按更谨慎的标准给出。如果我理解错了，可以在“我的资料”里否认，我会撤回。
profile_pending: 我注意到你的训练条件可能有变化，确认后会更新你的资料。
bmi_measured: 按你说的身高 {height} 厘米、体重 {weight} 公斤，BMI 约 {bmi}。成人 BMI 低于 18.5 为体重过低，18.5–23.9 为正常。
bmi_stated: 你说的 BMI 是 {bmi}。成人 BMI 低于 18.5 为体重过低，18.5–23.9 为正常。
page_handoff: 这个问题涉及其他方面，我帮你转到管家对话，在那里接着问就好，刚才看的内容会一起带过去。
