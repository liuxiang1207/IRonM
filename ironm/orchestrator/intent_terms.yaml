# 意图词表（spec [2026-10-21] §4）：每个意图一组说法，命中说法越多越可能是这个意图。
# 说法要写成统一后的形式：半角、小写、不含空白与分句符号。
# 两个意图命中数相同时取排在前面的：说法更具体的意图排在前面（“肌酸要怎么吃”是补剂，不是饮食）。
# concerns：身体不适、特殊人群两类关注点，只要出现就标出（只升不降），与主意图分开判断。
# 2026-10-21 由 Claude 撰写，属设计；新增说法时同步补 tests/intent_cases.yaml。
