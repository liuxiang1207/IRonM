# yaml-language-server: $schema=../schemas/rule_set.schema.json
# 问答链路（spec [2026-10-21] §4）：意图识别的置信度与追问门槛。改动后须同时改 tests/test_intent.py。
# 2026-10-21 由 Claude 受项目负责人委托设定，属设计取舍；逐项记录见 spec/review_log.md。
rule_set: chat
version: 2026.10.1
rules:
  - id: R-QA-INTENT
    title: 意图识别的置信度与追问
    status: approved
    source: {kind: design}
    params:
      rule_conf_clear: 0.85  # 词表命中 2 个以上说法且领先第二名
      rule_conf_single: 0.7  # 只命中 1 个说法、且没有并列
      rule_conf_tie: 0.45  # 两个意图命中数相同
      clarify_below: 0.5  # 合并后低于此值、又归不进任何领域：追问
      clarify_min_chars: 3  # 消息至少这么多个字才追问（“好”“嗯”不追问）
    note: 词表与模型都给出结果时取置信度高者，相同时取词表；身体不适、特殊人群两类关注点取两者之并，只升不降。

  - id: R-QA-MEMORY
    title: 对话压缩
    status: approved
    source: {kind: design}
    params:
      compress_at: 15  # 还没压缩的消息达到这么多条时压缩
      keep_recent: 6  # 压缩时保留原文的最近消息条数
    note: 摘要由模型生成，模型不可用时按话题汇总；摘要不展示给用户，只作为后续回答的上下文。

  - id: R-QA-DOMAINS
    title: 查知识的领域打分
    status: approved
    source: {kind: design}
    params:
      related_min_score: 0.45  # 相关领域的最低得分
      related_min_ratio: 0.55  # 相关领域不低于主领域得分的比例
    note: 分数 = 意图的固有分 × 置信度；主领域 1 个、相关领域最多 2 个；安全类的卡不参与打分、每次都查（spec [2026-10-21] §12）。
