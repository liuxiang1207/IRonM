# yaml-language-server: $schema=../schemas/rule_set.schema.json
# 指标计算的统计参数。改动任何一条规则，都要同时改对应测试。
# 2026-10-21 由 Claude 受项目负责人委托对照公开资料审定，未经执业医师或注册营养师复核；逐项记录见 spec/review_log.md。
rule_set: metrics
version: 2026.10.1
rules:
  - id: R-MT-WEIGHT-TREND
    title: 体重趋势回归的置信水平与最少读数
    status: approved
    source:
      kind: design
    params:
      ci_level: 0.95
      min_readings: 3
      min_span_days: 7  # 至少覆盖完整一周，避免被周末效应、节食初期的水分变化主导
      residual_ar1_rho: 0.4  # 相邻一天的波动相关系数；标准误乘以 √((1+r)/(1−r))，r = 0.4 ^ 平均间隔天数
    note: 可信范围按 t 分布计算，读数少时自然变宽；同一当地日期只取当天第一次可信读数。少于 3 次无法估计残差、覆盖不足 7 天时斜率不可靠，都不给趋势。

  - id: R-MT-TRAINING-COMPLETION
    title: 训练完成度的计分
    status: approved
    source:
      kind: design
    params:
      score_done: 1.0
      score_half: 0.5
      score_skipped: 0.0
      min_recorded_share: 0.75  # 有记录的计划日占比低于此值时为数据不足（没练的日子更可能不打卡）
    note: 计划日没有打卡记录的记为“未知”，不当作没练，不计入完成度。


  - id: R-MT-JUDGEMENT-WINDOW
    title: 体重判断窗口：先定需要多确定，再算需要多久
    status: approved
    source: {kind: design}
    params:
      target_half_width_kg_per_week: 0.25  # 趋势可信范围半宽不超过此值才能据以调整饮食
      default_residual_sd_kg: 0.5  # 读数不足以估计时的体重日常波动
      min_residual_sd_kg: 0.3  # 估计出的波动下限：真实的日常波动不可能为 0
      min_readings_for_sd: 6
      frequency_window_days: 28  # 称重频率按近几天的实际称重天数平均
      min_window_days: 7
      max_window_days: 56  # 超过仍不够确定就不下结论
    note: 置信水平取 R-MT-WEIGHT-TREND。方案中“每天称约 2 周”为估计，按本计算约 3 周。
