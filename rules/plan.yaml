# yaml-language-server: $schema=../schemas/rule_set.schema.json
# 第一版计划（spec §30）：训练规划师、动作教练、营养师的首批 Skill 使用。改动后须同时改 tests/skills/ 下对应测试。
# 2026-10-21 由 Claude 受项目负责人委托对照公开资料审定，未经认证教练或注册营养师复核；逐项记录见 spec/review_log.md。
rule_set: plan
version: 2026.10.1
rules:
  - id: R-TR-START
    title: 第一版每周训练结构
    status: approved
    source: {kind: guideline, ref: "WHO 身体活动指南（2020）：成人每周至少 2 天肌肉力量活动；ACSM 抗阻训练立场：初学者每个动作 1–3 组、8–12 次；IronM 方案 v3.0 §6.2 起点与递增"}
    params:
      strength_days: 2
      strength_days_max: 3
      three_days_min_available: 5  # 可练天数达到此值时力量训练 3 次
      slots: [squat, hinge, push, pull, core]
      sets: 2
      reps_low: 8
      reps_high: 12
      rpe_low: 6
      rpe_high: 7
      cardio_start_min: 90
      cardio_start_min_conservative: 60  # B 与协作层
      cardio_target_min: 300  # 有氧起点的上限：ACSM 减重立场每周 200–300 分钟；已超过的按此值（冲刺 2 复核 M4）
      review_days: 14
      # 每周哪几天练（0 = 周一 … 6 = 周日），力量训练之间尽量隔开一天（spec [2026-10-21] §15）
      days_1: [2]
      days_2: [0, 3]
      days_3: [0, 2, 4]
      days_4: [0, 1, 3, 4]
      days_5: [0, 1, 2, 3, 4]
    note: 有氧起点 = 当前每周运动分钟 + 安全官规则中按分层的每周增量（R-SF-TIER-LIMITS：A 30、B 20），不超过 cardio_target_min；RPE 上限、每周有氧上限另受安全官约束，取更严者。

  - id: R-EX-MINIMUM
    title: 最低任务
    status: approved
    source: {kind: borrowed, ref: "IronM 方案 v3.0 §6.2：每次训练都有 2–4 个动作、每个 1–3 组的最低版本"}
    params:
      patterns: [squat, push, hinge]
      sets: 2

  - id: R-NU-DIET-MODE
    title: 默认饮食模式
    status: approved
    source: {kind: design}
    params:
      by_precision_p3: precise
      by_precision_p2: simple
      by_precision_p1: habit
      by_precision_p0: habit
    note: 用户选过的模式优先；否则按饮食精度，默认最轻（IronM 方案 v3.0 §6.3 三种模式、§7.1 默认最轻）。

  - id: R-HB-ROUTINE
    title: 称重日、签到日与提醒时间
    status: approved
    source: {kind: design, ref: "IronM 搭建计划表 v1.0 D44（称重默认每周 2 次、固定日、晨起空腹；每周签到约 1 分钟）、D55（只在称重日早上、签到日晚上、漏打卡次日提醒，每天最多 1 条）"}
    params:
      weigh_in_days: [0, 3]  # 周一、周四早上空腹称重（0 = 周一 … 6 = 周日）
      checkin_day: 6  # 周日晚上做每周签到
      weigh_in_time: "07:30"
      checkin_time: "20:00"
      followup_time: "08:00"  # 漏打卡或没签到时，第二天这个时间问一句
      review_days: 28
    note: 安全官给出称重次数上限（如进食障碍史每周最多 1 次）时，只保留排在前面的称重日；一周从周一算起（spec [2026-10-21] §15）。


  - id: R-RV-WEEKLY
    title: 每周训练复盘决策表
    status: approved
    source: {kind: design, ref: "IronM 计划生成链路 v1.2 周训练复盘决策表；ACSM 抗阻训练立场（先加组、再加次数、最后加负荷的渐进顺序）"}
    params:
      fatigue_rise: 2  # 疲劳比前两次签到的平均高这么多分（1–5 分制）
      sleep_low: 2  # 睡眠质量不高于此值
      rpe_high: 9  # 本周平均 RPE 不低于此值
      low_completion: 0.5  # 完成率低于此值（连续两周才下调）
      high_completion: 0.9  # 完成率不低于此值才进阶
      rpe_ok: 7  # 进阶要求平均 RPE 不高于此值；没记 RPE 时改为要求连续两周完成率达标
      cardio_cut_pct: 20  # 有氧下调的比例
      max_sets: 3  # 进阶先把每个动作加到 3 组
      max_reps_high: 15  # 再把次数上限加到 15
      review_days: 14
      recovery_floor_pct: 50  # 恢复性下调时有氧不低于起点的一半（项目负责人确认，快进模拟后）
      recovery_max_weeks: 3  # 连续 3 周命中恢复行：不再减量，提示先休息、持续不缓解请就医
    note: 按表中顺序取第一条命中的；签到说“只记录了一部分”的一周不调整，标了经期的一周不下调（spec [2026-10-21] §17）。有氧每档增量取安全官规则 R-SF-TIER-LIMITS（A、A′ 30 分钟，B、协作 20 分钟），上限取安全官约束与 R-TR-START 的 cardio_target_min 中更严者。

  - id: R-RV-DIET
    title: 两周饮食复盘决策表（只对减脂）
    status: approved
    source: {kind: borrowed, ref: "IronM 减脂模块方案 v0.3 §5、§7；计划生成链路 v1.2 两周饮食复盘：每次调整 150 千卡、不破热量底线、前 4 周不判断减太快"}
    params:
      min_meal_days_per_week: 4  # 7 天里至少几天有饮食记录
      min_weigh_ins_per_week: 1
      max_ci_half_width: 0.4  # 体重趋势可信范围半宽（千克 / 周）不超过此值才判断（快进模拟后由 0.25 放宽）
      low_completion: 0.5  # 训练完成率低于此值时先降计划难度，饮食不变
      low_adherence_days: 3  # 按计划吃的天数低于此值时饮食不变
      ok_completion: 0.7
      ok_adherence_days: 4
      step_kcal: 150
      fast_loss_kg_per_week: 1.0
      fast_loss_after_days: 28
      target_low_a: 0.5  # A 层每周减重目标下限（千克）
      target_low_a_prime: 0.25  # A′ 层
      trend_window_days: 28  # 体重趋势按最近 28 天（快进模拟后由 14 天改）
      review_days: 14
    note: 按顺序取第一条命中的（spec [2026-10-21] §17）；降热量要连续两个周期满足条件；不低于热量底线（安全官约束）。

  - id: R-RV-RETURN
    title: 中断回归
    status: approved
    source: {kind: borrowed, ref: "IronM 计划生成链路 v1.2：≤1 周照常、1–4 周训练量约减半起步并在 1–2 周内回升、超过 4 周重做基线测试与安全筛查；第一句说“欢迎回来”"}
    params:
      gap_days: 7  # 超过这么多天没有任何训练记录（且签到没说练了）算中断
      rebaseline_after_days: 28  # 中断超过这么多天，先重做基线测试与安全筛查
      halve_for_days: 14  # 回来后这么多天内训练量减半
    note: 没记录不等于没练：签到说“按计划练了但没记”或“在别处练”的那一周算练了（spec [2026-10-21] §17）。
