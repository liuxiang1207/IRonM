[project]
name = "ironm"
version = "0.1.0"
description = "IronM - 你的健身AI管家"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.9",
    "pyyaml>=6.0",
    "uvicorn>=0.32",
]

[dependency-groups]
dev = [
    "httpx2>=2.15",
    "hypothesis>=6.100",
    "import-linter>=2.1",
    "mypy>=1.13",
    "pre-commit>=4.0",
    "pytest>=8.3",
    "ruff>=0.8",
    "types-pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ironm"]

[tool.uv]
required-version = ">=0.5"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# 项目以中文书写注释与文档，全角标点不是易混淆字符
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["ironm", "tests", "evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -ra --strict-markers --strict-config"
# 预期失败的测试一旦意外通过也算失败，提醒去掉标记
xfail_strict = true
filterwarnings = ["error"]

# 模块依赖方向（spec [2026-10-20] §1）：上层可依赖下层，反之不行；同一行用 | 分隔的互不依赖。
# store 放在 agents 之上，使 agents / skills / 计算层都无法直接读写存储。
# safety 只在 contracts、core 之上，保证离线、模型不可用时仍能独立运行。
# exhaustive：ironm 下每个子包都必须在这里登记，新增子包漏登记即失败。
[tool.importlinter]
root_package = "ironm"

[[tool.importlinter.contracts]]
name = "业务模块分层"
type = "layers"
containers = ["ironm"]
exhaustive = true
layers = [
    "api",
    "scheduler",
    "orchestrator",
    "memory",
    "store",
    "agents",
    "skills",
    "engine | knowledge | llm",
    "rules",
    "safety",
    "contracts",
    "core",
]
