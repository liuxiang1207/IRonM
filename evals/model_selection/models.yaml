# 参与评测的模型与配置。密钥不写在这里：api_key_env 指明从哪个环境变量读取（本地放在 .env）。
# 价格：每百万 token，按厂商原币种填写，来自官方价格页（核对于 2026-10-20）；评测时统一换算为美元。
# 汇率：1 美元 ≈ 6.68 元（2026-10-20 市场中间价附近）。
# DeepSeek 高峰：周一至周五 UTC 01:00–04:00、06:00–10:00，其余为非高峰；月之暗面不分时段。
cny_per_usd: 6.68

models:
  - name: deepseek-flash
    provider: deepseek
    base_url: https://api.deepseek.com
    model: deepseek-flash
    api_key_env: DEEPSEEK_API_KEY
    thinking: false
    extra_body: {thinking: {type: disabled}}
    price_per_mtok: &flash
      currency: USD
      offpeak: {input_hit: 0.003, input_miss: 0.15, output: 0.6}
      peak: {input_hit: 0.006, input_miss: 0.3, output: 1.2}

  - name: deepseek-flash-thinking
    provider: deepseek
    base_url: https://api.deepseek.com
    model: deepseek-flash
    api_key_env: DEEPSEEK_API_KEY
    thinking: true
    extra_body: {thinking: {type: enabled}}
    price_per_mtok: *flash

  - name: deepseek-v4-pro
    provider: deepseek
    base_url: https://api.deepseek.com
    model: deepseek-v4-pro
    api_key_env: DEEPSEEK_API_KEY
    thinking: false
    extra_body: {thinking: {type: disabled}}
    price_per_mtok: &pro
      currency: USD
      offpeak: {input_hit: 0.022, input_miss: 0.66, output: 1.98}
      peak: {input_hit: 0.044, input_miss: 1.32, output: 3.96}

  - name: deepseek-v4-pro-thinking
    provider: deepseek
    base_url: https://api.deepseek.com
    model: deepseek-v4-pro
    api_key_env: DEEPSEEK_API_KEY
    thinking: true
    extra_body: {thinking: {type: enabled}}
    price_per_mtok: *pro

  - name: kimi-k2.6
    provider: moonshot
    base_url: https://api.moonshot.cn/v1
    model: kimi-k2.6
    api_key_env: MOONSHOT_API_KEY
    thinking: false
    extra_body: {thinking: {type: disabled}}
    price_per_mtok: &kimi
      currency: CNY
      offpeak: {input_hit: 1.10, input_miss: 6.50, output: 27.00}
    # 当前账户为免费档：每分钟最多 3 次请求
    rate_limit: &kimi_rl {concurrency: 1, min_interval_s: 21}

  - name: kimi-k2.6-thinking
    provider: moonshot
    base_url: https://api.moonshot.cn/v1
    model: kimi-k2.6
    api_key_env: MOONSHOT_API_KEY
    thinking: true
    extra_body: {thinking: {type: enabled}}
    price_per_mtok: *kimi
    rate_limit: *kimi_rl
